<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Policy-Gated Support Agent</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e37;
    --text: #e6e8eb;
    --muted: #9aa0aa;
    --accent: #5b8def;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  .layout {
    display: grid;
    grid-template-columns: 380px 1fr;
    height: calc(100vh - 64px);
  }
  .list-pane {
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px;
  }
  .submit-form {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
  }
  .submit-form textarea, .submit-form input, .detail-pane textarea, .detail-pane input {
    width: 100%;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    font-size: 13px;
    margin-bottom: 8px;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .ticket-row {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .ticket-row:hover { border-color: var(--accent); }
  .ticket-row.selected { border-color: var(--accent); background: #1a2030; }
  .ticket-row .top-line { display: flex; justify-content: space-between; align-items: center; }
  .ticket-row .rider { font-size: 13px; color: var(--muted); }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
  }
  .badge.SUBMITTED, .badge.TRIAGED { background: #3a3f4b; color: #cfd3da; }
  .badge.AUTO_RESOLVED { background: #1e4029; color: #6fd48c; }
  .badge.ESCALATED_ROUTINE { background: #4a3a1e; color: #e6b566; }
  .badge.ESCALATED_URGENT { background: #4a1e1e; color: #f28b8b; }
  .badge.CLOSED { background: #23262d; color: #7d828c; }
  .ticket-row .snippet { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .detail-pane { padding: 20px 28px; overflow-y: auto; }
  .empty-state { color: var(--muted); padding: 40px; text-align: center; }
  .messages { margin: 12px 0; }
  .message-bubble {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .message-bubble .meta { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .section-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 20px 0 8px; }
  .kv-grid { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 13px; }
  .kv-grid dt { color: var(--muted); }
  .audit-entry {
    border-left: 2px solid var(--border);
    padding: 6px 0 6px 12px;
    margin-bottom: 6px;
    font-size: 12px;
  }
  .audit-entry .actor { font-weight: 600; }
  .audit-entry pre { white-space: pre-wrap; word-break: break-word; color: var(--muted); margin: 4px 0 0; }
  .error-banner { background: #4a1e1e; color: #f28b8b; padding: 8px 12px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; }
  .actions-row { display: flex; gap: 8px; margin-top: 10px; }
</style>
</head>
<body>

<header>
  <h1>Policy-Gated Support Agent</h1>
  <p>The LLM extracts signals. The policy engine decides what happens. Every decision is logged.</p>
</header>

<div class="layout">
  <div class="list-pane">
    <div class="submit-form">
      <div class="section-title" style="margin-top:0">New grievance</div>
      <input id="new-rider-id" placeholder="rider id (e.g. rider-42)" />
      <textarea id="new-message" rows="3" placeholder="What happened?"></textarea>
      <button id="submit-btn" onclick="submitTicket()">Submit</button>
    </div>
    <div id="ticket-list"></div>
  </div>
  <div class="detail-pane" id="detail-pane">
    <div class="empty-state">Select a ticket, or submit a new one.</div>
  </div>
</div>

<script>
  let tickets = [];
  let selectedId = null;
  let lastRenderedSnapshot = null;

  async function api(path, options) {
    const res = await fetch(path, options);
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || `Request failed (${res.status})`);
    }
    return res.status === 204 ? null : res.json();
  }

  function fmtTime(iso) {
    return new Date(iso).toLocaleString();
  }

  async function loadTickets() {
    tickets = await api("/tickets");
    renderList();
    if (selectedId) {
      const stillExists = tickets.find(t => t.id === selectedId);
      if (stillExists) {
        const snapshot = JSON.stringify(stillExists);
        if (snapshot === lastRenderedSnapshot) {
          return; // nothing actually changed - don't flash the pane for no reason
        }
        const draftInput = document.getElementById("followup-text");
        const draft = draftInput ? draftInput.value : "";
        await renderDetail(stillExists);
        await loadAuditLog(selectedId);
        lastRenderedSnapshot = snapshot;
        const restoredInput = document.getElementById("followup-text");
        if (restoredInput && draft) restoredInput.value = draft;
      }
    }
  }

  function renderList() {
    const container = document.getElementById("ticket-list");
    if (tickets.length === 0) {
      container.innerHTML = '<div class="empty-state">No tickets yet.</div>';
      return;
    }
    container.innerHTML = tickets.map(t => {
      const lastMsg = t.messages[t.messages.length - 1];
      return `
        <div class="ticket-row ${t.id === selectedId ? 'selected' : ''}" onclick="selectTicket('${t.id}')">
          <div class="top-line">
            <span class="rider">${escapeHtml(t.rider_id)}</span>
            <span class="badge ${t.state}">${t.state}</span>
          </div>
          <div class="snippet">${escapeHtml(lastMsg.text).slice(0, 80)}</div>
        </div>
      `;
    }).join("");
  }

  function selectTicket(id) {
    selectedId = id;
    renderList();
    const ticket = tickets.find(t => t.id === id);
    lastRenderedSnapshot = JSON.stringify(ticket);
    renderDetail(ticket);
    loadAuditLog(id);
  }

  async function renderDetail(ticket) {
    const pane = document.getElementById("detail-pane");
    const canResolve = ticket.state === "ESCALATED_ROUTINE" || ticket.state === "ESCALATED_URGENT";

    pane.innerHTML = `
      <div id="error-slot"></div>
      <div class="top-line" style="display:flex; justify-content:space-between; align-items:center;">
        <h2 style="margin:0; font-size:16px;">${escapeHtml(ticket.rider_id)}</h2>
        <span class="badge ${ticket.state}">${ticket.state}</span>
      </div>

      <div class="section-title">Messages</div>
      <div class="messages">
        ${ticket.messages.map(m => `
          <div class="message-bubble">
            <div class="meta">#${m.seq} · ${fmtTime(m.submitted_at)}</div>
            ${escapeHtml(m.text)}
          </div>
        `).join("")}
      </div>

      <div class="actions-row">
        <input id="followup-text" placeholder="Add a follow-up message..." style="flex:1" />
        <button onclick="addMessage('${ticket.id}')">Send</button>
        ${canResolve ? `<button class="secondary" onclick="resolveTicket('${ticket.id}')">Resolve</button>` : ""}
      </div>

      ${ticket.extraction ? `
        <div class="section-title">Latest extraction</div>
        <dl class="kv-grid">
          <dt>Category</dt><dd>${escapeHtml(ticket.extraction.category)}</dd>
          <dt>Urgency</dt><dd>${escapeHtml(ticket.extraction.urgency)}</dd>
          <dt>Sentiment</dt><dd>${escapeHtml(ticket.extraction.sentiment)}</dd>
          <dt>Confidence</dt><dd>${ticket.extraction.confidence.toFixed(2)}</dd>
          <dt>Summary</dt><dd>${escapeHtml(ticket.extraction.summary)}</dd>
        </dl>
      ` : ""}

      ${ticket.decision ? `
        <div class="section-title">Policy decision</div>
        <dl class="kv-grid">
          <dt>Action</dt><dd>${escapeHtml(ticket.decision.action)}</dd>
          <dt>Rule</dt><dd>${escapeHtml(ticket.decision.rule_id)}</dd>
          <dt>Reason</dt><dd>${escapeHtml(ticket.decision.reason)}</dd>
        </dl>
      ` : ""}

      <div class="section-title">Audit trail</div>
      <div id="audit-log">Loading...</div>
    `;
  }

  async function loadAuditLog(ticketId) {
    const entries = await api(`/tickets/${ticketId}/audit-log`);
    const el = document.getElementById("audit-log");
    if (!el) return;
    el.innerHTML = entries.map(e => `
      <div class="audit-entry">
        <span class="actor">${escapeHtml(e.actor)}</span>
        ${e.provider ? ` · ${escapeHtml(e.provider)}` : ""}
        ${e.latency_ms != null ? ` · ${e.latency_ms}ms` : ""}
        · ${fmtTime(e.timestamp)}
        <pre>${escapeHtml(JSON.stringify(e.output, null, 2))}</pre>
      </div>
    `).join("");
  }

  function showError(message) {
    const slot = document.getElementById("error-slot");
    if (slot) slot.innerHTML = `<div class="error-banner">${escapeHtml(message)}</div>`;
    else alert(message);
  }

  async function submitTicket() {
    const riderId = document.getElementById("new-rider-id").value.trim();
    const message = document.getElementById("new-message").value.trim();
    if (!riderId || !message) return;

    const btn = document.getElementById("submit-btn");
    btn.disabled = true;
    try {
      const ticket = await api("/tickets", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rider_id: riderId, message }),
      });
      document.getElementById("new-message").value = "";
      await loadTickets();
      selectTicket(ticket.id);
    } catch (e) {
      alert(e.message);
    } finally {
      btn.disabled = false;
    }
  }

  async function addMessage(ticketId) {
    const input = document.getElementById("followup-text");
    const message = input.value.trim();
    if (!message) return;
    const ticket = tickets.find(t => t.id === ticketId);
    try {
      await api(`/tickets/${ticketId}/messages`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rider_id: ticket.rider_id, message }),
      });
      await loadTickets();
      selectTicket(ticketId);
    } catch (e) {
      showError(e.message);
    }
  }

  async function resolveTicket(ticketId) {
    try {
      await api(`/tickets/${ticketId}/resolve`, { method: "POST" });
      await loadTickets();
      selectTicket(ticketId);
    } catch (e) {
      showError(e.message);
    }
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str ?? "";
    return div.innerHTML;
  }

  loadTickets();
  setInterval(loadTickets, 10000);
</script>

</body>
</html>
